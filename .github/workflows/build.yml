name: Build Marchel Records

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build app and DMG
        env:
          VERSION: "1.0.${{ github.run_number }}"
          BUILD: "${{ github.run_number }}"
        run: ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Marchel-Records
          path: dist/Marchel-Records.dmg
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "Marchel Records 1.0.${{ github.run_number }}"
          files: dist/Marchel-Records.dmg
          make_latest: true
